name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [  ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.19', '1.20']
        os: ['ubuntu-latest']
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
    
    - name: Wait for PostgreSQL
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U root; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Attempt $i: PostgreSQL not ready yet..."
          sleep 2
        done
        echo "PostgreSQL failed to start"
        exit 1
      env:
        PGPASSWORD: root
    
    - name: Test
      run: go test -v ./... 
      
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
  Docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit
